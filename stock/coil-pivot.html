<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coil Stock — Bharat Steel MIS</title><link rel="icon" type="image/png" href="BSC.png"/>
<script>window.PORTAL={module:'stock',screen:'pivot'}</script>
<style>
  /* Compact one-page layout: the five grade pivots sit side by side, no scrolling */
  #blocks.gradegrid{display:flex;gap:10px;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto}
  .gradegrid .card{margin:10px 0;padding:8px 10px;flex:0 0 auto}
  .gradegrid .card h3{margin:0 0 6px;font-size:11px;letter-spacing:.06em}
  .gradegrid .card h3 .r{font-size:10px}
  .gradegrid .tblwrap{overflow:visible}
  .gradegrid table.pivot{font-size:11px}
  .gradegrid .pivot th{padding:4px 6px;font-size:9px}
  .gradegrid .pivot td{padding:2px 6px;line-height:1.25}
  .gradegrid .pivot td.num{white-space:nowrap}
  /* let the two big grades (more widths) breathe, keep small ones tight */
  @media (max-width:1100px){ #blocks.gradegrid{flex-wrap:wrap} }
  @media print{
    @page{size:landscape;margin:8mm}
    #blocks.gradegrid{flex-wrap:nowrap;overflow:visible}
    .gradegrid .card{box-shadow:none;break-inside:avoid}
    footer{display:none}
  }
</style>
</head><body>
<div class="pw">
  <div id="errbox"></div>
  <div class="filters">
    <label>Location
      <select id="loc" onchange="draw()"><option value="">All Chennai + Salem</option>
        <option value="chennai">Chennai (11·38)</option><option value="salem">Salem (22·07)</option></select></label>
    <label>Measure <select id="measure" onchange="draw()">
      <option value="OnHand">On hand</option><option value="Committed">Booked</option>
      <option value="OnOrder">Incoming</option><option value="Available">Available</option></select></label>
    <label><input type="checkbox" id="allW" onchange="draw()"/> all widths (incl. slit)</label>
    <span class="fcount" id="fcount"></span>
  </div>
  <div id="blocks" class="gradegrid"></div>
  <div class="card" id="drillCard" style="display:none"><h3>Items in <span class="r" id="drillSub"></span></h3><div class="tblwrap" id="drill"></div></div>
  <footer id="foot"></footer>
</div>
<script src="../_portal.js"></script>
<script src="_stockdata.js"></script>
<script>
let S={},sel=null;
const GRADES=['E250','E350','E450','E550','IS3502 / IS10748'];
const STDW=new Set([1250,1500,2000,2500]);
function bucket(g){
  const G=(g||'').toUpperCase();
  if(G.includes('IS3502')||G.includes('IS10748'))return 'IS3502 / IS10748';
  if(G.includes('E550')||G.includes('HSFQ550'))return 'E550';
  if(G.includes('E450')||G.includes('HSFQ450'))return 'E450';
  if(G.includes('E350'))return 'E350';
  if(G.includes('E250')||G.trim()==='IS2062'||G.startsWith('IS2062'))return 'E250';
  return null;
}
function excl(g){const G=(g||'').toUpperCase();return ['FE550D','FE500D','SEQR','EQR'].some(t=>G.includes(t))||G.includes('WIR')||G==='IS1309';}
function scope(){
  const loc=$('loc').value;
  return S.STOCK.filter(r=>{
    if(loc==='chennai'&&LOC[r.WhsCode]!=='Chennai')return false;
    if(loc==='salem'&&LOC[r.WhsCode]!=='Salem')return false;
    return true;
  });
}
function draw(){
  const meas=$('measure').value, allW=$('allW').checked, rs=scope();
  let html=''; let grand=0, gcount=0;
  GRADES.forEach(gr=>{
    const items=rs.filter(r=>!excl(r.Grade)&&bucket(r.Grade)===gr&&r.T&&r.W&&(allW||STDW.has(r.W))&&(r[meas]||0)>0);
    if(!items.length) return;
    const data={},Ws=new Set(),Ts=new Set(),colTot={};
    items.forEach(r=>{(data[r.T]??={})[r.W]=(data[r.T][r.W]||0)+(r[meas]||0);Ts.add(r.T);Ws.add(r.W);colTot[r.W]=(colTot[r.W]||0)+(r[meas]||0);});
    const ts=[...Ts].sort((a,b)=>a-b),ws=[...Ws].sort((a,b)=>a-b);
    const gtot=Object.values(colTot).reduce((a,b)=>a+b,0); grand+=gtot; gcount+=items.length;
    let t=`<table class="pivot"><thead><tr><th>T \\ W</th>${ws.map(w=>`<th class="num">${w}</th>`).join('')}<th class="num">Grand Total</th></tr></thead><tbody>`;
    ts.forEach(T=>{const rt=ws.reduce((a,w)=>a+(data[T][w]||0),0);
      t+=`<tr><td class="num"><b>${T}</b></td>${ws.map(w=>{const v=data[T][w]||0;return `<td class="num cell${sel&&sel.g===gr&&sel.t===T&&sel.w===w?' sel':''}" ${v?`data-g="${esc(gr)}" data-t="${T}" data-w="${w}"`:''}>${v?f1(v):''}</td>`;}).join('')}<td class="num"><b>${f1(rt)}</b></td></tr>`;});
    t+=`<tr class="tot"><td>Grand Total</td>${ws.map(w=>`<td class="num">${f1(colTot[w]||0)}</td>`).join('')}<td class="num">${f1(gtot)}</td></tr></tbody></table>`;
    html+=`<div class="card"><h3>${esc(gr)} <span class="r">${f1(gtot)} MT · ${items.length} items</span></h3><div class="tblwrap">${t}</div></div>`;
  });
  $('blocks').innerHTML=html||'<div class="empty">No dimensioned coil stock for this filter.</div>';
  $('fcount').textContent=`${gcount} items · ${f1(grand)} MT ${meas.replace('OnHand','on hand').replace('OnOrder','incoming')}`;
  document.querySelectorAll('#blocks td.cell[data-t]').forEach(td=>td.onclick=()=>drill(td.dataset.g,+td.dataset.t,+td.dataset.w));
  if(sel)drill(sel.g,sel.t,sel.w);
}
// GRPO date (coil-in date) as DD-MMM-YY; '—' when missing
function fdate(s){if(!s)return '—';const m=String(s).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return esc(String(s));const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${m[3]}-${M[+m[2]-1]}-${m[1].slice(2)}`;}
function drill(g,t,w){
  sel={g,t,w};
  document.querySelectorAll('#blocks td.cell').forEach(td=>td.classList.toggle('sel',td.dataset.g===g&&+td.dataset.t===t&&+td.dataset.w===w));
  const meas=$('measure').value;
  const items=scope().filter(r=>!excl(r.Grade)&&bucket(r.Grade)===g&&r.T===t&&r.W===w&&(r[meas]||0)>0).sort((a,b)=>b[meas]-a[meas]);
  // physical coils (batch no + GRPO date) for this size/grade — coils.csv covers the coil warehouses (38, 22)
  const inLoc=wh=>{const l=$('loc').value;return l==='chennai'?LOC[wh]==='Chennai':l==='salem'?LOC[wh]==='Salem':true;};
  const byKey={}; (S.COILS||[]).filter(c=>inLoc(c.WhsCode)&&!excl(c.Grade)&&bucket(c.Grade)===g&&c.T===t&&c.W===w&&c.Quantity>0)
    .forEach(c=>(byKey[c.ItemCode+'|'+c.WhsCode]??=[]).push(c));
  // expand each item×warehouse into its individual coils; keep one row where no batch data exists (e.g. WH 07/11/52)
  const rows2=[];
  items.forEach(r=>{
    const batches=(byKey[r.ItemCode+'|'+r.WhsCode]||[]).slice().sort((a,b)=>String(a.GRPODate||'').localeCompare(String(b.GRPODate||'')));
    if(batches.length) batches.forEach((c,i)=>rows2.push({r,first:i===0,mt:c.Quantity,batch:c.BatchNum,grpo:c.GRPODate}));
    else rows2.push({r,first:true,mt:r.OnHand,batch:'',grpo:''});
  });
  const totMT=rows2.reduce((a,x)=>a+(x.mt||0),0);
  $('drillCard').style.display=''; $('drillSub').textContent=`${g} · ${t} × ${w} · ${rows2.length} coils · ${f1(totMT)} MT`;
  $('drill').innerHTML=`<table><thead><tr><th>Item</th><th>Brand</th><th>Grade</th><th>Whs</th><th class="num">On hand</th><th class="num">Booked</th><th class="num">Available</th><th>Batch No</th><th class="num">GRPO Date</th></tr></thead><tbody>
    ${rows2.map(x=>{const r=x.r;return `<tr><td>${esc(r.ItemName)}<div class="muted">${esc(r.ItemCode)}</div></td><td><span class="tag">${esc(r.Brand)}</span></td><td class="muted">${esc(r.Grade)}</td><td class="num">${r.WhsCode}</td><td class="num"><b>${f3(x.mt)}</b></td><td class="num">${x.first&&r.Committed?f3(r.Committed):''}</td><td class="num">${x.first?f3(r.Available):''}</td><td>${esc(x.batch||'—')}</td><td class="num">${fdate(x.grpo)}</td></tr>`;}).join('')}</tbody></table>`;
}
(async function(){
  try{S=await loadStock();}catch(e){$('errbox').innerHTML='<div class="err">Couldn\'t load stock data.</div>';return;}
  S.STOCK=S.STOCK.filter(r=>/COIL/i.test(r.ItemName)||r.WhsCode==='38'||r.WhsCode==='22'||r.WhsCode==='07');
  $('foot').textContent='Grades grouped: E250 (incl. IS2062), E350, E450, E550, IS3502/IS10748. TMT, job-work and un-graded coils are excluded.';
  draw();
})();
</script>
</body></html>
