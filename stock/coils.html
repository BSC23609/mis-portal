<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coil Stock List — Bharat Steel MIS</title><link rel="icon" href="BSC.png"/>
<script>window.PORTAL={module:'stock',screen:'coils'}</script>
</head><body>
<div class="pw">
  <div id="errbox"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search item / batch / coil no / bin…" oninput="draw()"/>
    <label>Age <select id="age" onchange="draw()"><option value="">Any</option><option value="30">30+ days</option><option value="60">60+ days</option><option value="90">90+ days</option></select></label>
    <label><input type="checkbox" id="grp" onchange="draw()"/> group by item</label>
    <button class="pbtn" style="background:var(--blue);border-color:var(--blue)" onclick="dl()">Download CSV</button>
    <span class="fcount" id="fcount"></span>
  </div>
  <div class="card"><h3>Coil stock — warehouse 38 <span class="r" id="sub"></span></h3><div class="tblwrap scroll" id="tbl"></div></div>
  <footer id="foot"></footer>
</div>
<script src="../_portal.js"></script>
<script src="_stockdata.js"></script>
<script>
let S={};
function rows(){
  const q=($('q').value||'').toLowerCase(),am=num($('age').value);
  return S.COILS.filter(r=>(!q||[r.ItemName,r.BatchNum,r.CoilNo,r.Bin].some(v=>(v||'').toLowerCase().includes(q)))&&(!am||(r.age!==null&&r.age>=am)));
}
function draw(){
  let rs=rows(); const tot=rs.reduce((a,r)=>a+r.Quantity,0);
  $('sub').textContent=`${rs.length} coils · ${f3(tot)} MT`; $('fcount').textContent=`${rs.length} coils`;
  if($('grp').checked){
    const m={}; rs.forEach(r=>{const o=m[r.ItemName]??={q:0,n:0,age:0};o.q+=r.Quantity;o.n++;if(r.age!==null)o.age=Math.max(o.age,r.age);});
    $('tbl').innerHTML=`<table><thead><tr><th>Item</th><th class="num">Coils</th><th class="num">MT</th><th class="num">Oldest (d)</th></tr></thead><tbody>
      ${Object.entries(m).sort((a,b)=>b[1].q-a[1].q).map(([n,o])=>`<tr><td>${esc(n)}</td><td class="num">${o.n}</td><td class="num"><b>${f3(o.q)}</b></td><td class="num" style="${o.age>=90?'color:var(--red);font-weight:700':''}">${o.age||''}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="num">${rs.length}</td><td class="num">${f3(tot)}</td><td></td></tr></tbody></table>`;
    return;
  }
  rs=rs.sort((a,b)=>(b.age||0)-(a.age||0));
  $('tbl').innerHTML=rs.length?`<table><thead><tr><th>Item</th><th>Grade</th><th class="num">T</th><th class="num">W</th><th>Batch</th><th>Coil no</th><th>Bin</th><th class="num">GRPO</th><th class="num">Age (d)</th><th class="num">MT</th></tr></thead><tbody>
    ${rs.map(r=>`<tr><td><b>${esc(r.ItemName)}</b></td><td class="muted">${esc(r.Grade)}</td><td class="num">${nz(r.T)}</td><td class="num">${nz(r.W)}</td><td class="mono">${esc(r.BatchNum)}</td><td class="mono">${esc(r.CoilNo)}</td><td class="muted">${esc(r.Bin)}</td><td class="num">${esc(r.GRPONo)}</td><td class="num" style="${r.age>=90?'color:var(--red);font-weight:700':''}">${r.age??''}</td><td class="num"><b>${f3(r.Quantity)}</b></td></tr>`).join('')}
    <tr class="tot"><td colspan="9">Total</td><td class="num">${f3(tot)}</td></tr></tbody></table>`:'<div class="empty">No coils match.</div>';
}
function dl(){
  const rs=rows(),head=['ItemCode','ItemName','Grade','Thickness','Width','BatchNum','CoilNo','Bin','GRPONo','GRPODate','AgeDays','Quantity'];
  const csv=[head.join(',')].concat(rs.map(r=>[r.ItemCode,`"${r.ItemName}"`,r.Grade,r.T,r.W,r.BatchNum,r.CoilNo,`"${r.Bin}"`,r.GRPONo,r.GRPODate,r.age,r.Quantity].join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='coil_stock_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
(async function(){
  try{S=await loadStock();}catch(e){$('errbox').innerHTML='<div class="err">Couldn\'t load stock data.</div>';return;}
  $('foot').textContent=`${S.COILS.length} coil batches`;
  draw();
})();
</script>
</body></html>
