<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monthly Stock List — Bharat Steel MIS</title><link rel="icon" type="image/png" href="BSC.png"/>
<script>window.PORTAL={module:'stock',screen:'monthly'}</script>
<style>
  .mgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
  @media(max-width:900px){.mgrid{grid-template-columns:1fr}}
  #tbl table td,#tbl table th{padding:5px 10px}
  #chart svg{width:100%;height:auto;display:block}
</style>
</head><body>
<div class="pw">
  <div id="errbox"></div>
  <div class="filters" style="margin:8px 0">
    <span class="fcount" id="intro">Current coil stock (warehouse 38) grouped by GRPO purchase month</span>
    <button class="pbtn" style="background:var(--blue);border-color:var(--blue);margin-left:auto" onclick="dl()">Download CSV</button>
  </div>

  <div class="kpis" id="kpis" style="margin:8px 0"></div>

  <div class="mgrid">
    <div class="card" style="margin:0">
      <h3>Monthly stock availability <span class="r" id="sub"></span></h3>
      <div class="tblwrap" id="tbl"></div>
    </div>
    <div class="card" style="margin:0">
      <h3>Available stock by purchase month</h3>
      <div id="chart"></div>
    </div>
  </div>

  <footer id="foot" style="margin-top:8px"></footer>
</div>
<script src="../_portal.js"></script>
<script src="_stockdata.js"></script>
<script>
let S={}, MONTHS=[], TOTQ=0, TOTN=0, NODATE={q:0,n:0};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monLabel(k){ const [y,m]=k.split('-').map(Number); return MN[m-1]+' '+y; }
function monthRange(minK,maxK){ const out=[]; let [y,m]=minK.split('-').map(Number); const [ey,em]=maxK.split('-').map(Number);
  while(y<ey||(y===ey&&m<=em)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} } return out; }
function pct(x){ return (x*100).toFixed(1)+'%'; }

function build(){
  const map={};
  S.COILS.forEach(r=>{
    if(r.GRPODate && /^\d{4}-\d{2}/.test(r.GRPODate)){
      const k=r.GRPODate.slice(0,7); (map[k]||(map[k]={q:0,n:0})); map[k].q+=r.Quantity; map[k].n++;
    } else { NODATE.q+=r.Quantity; NODATE.n++; }
  });
  const keys=Object.keys(map).sort();
  TOTQ=S.COILS.reduce((a,r)=>a+r.Quantity,0); TOTN=S.COILS.length;
  if(!keys.length){ MONTHS=[]; return; }
  MONTHS=monthRange(keys[0],keys[keys.length-1]).map(k=>({k,label:monLabel(k),q:(map[k]?map[k].q:0),n:(map[k]?map[k].n:0)}));
}

function drawKpis(){
  const oldest=MONTHS.length?MONTHS.find(m=>m.n>0):null;
  $('kpis').innerHTML=`
    <div class="kpi"><div class="lab">Total available stock</div><div class="val">${f3(TOTQ)} <small>MT</small></div></div>
    <div class="kpi"><div class="lab">Coils in stock</div><div class="val">${TOTN}</div></div>
    <div class="kpi"><div class="lab">Oldest purchase month</div><div class="val" style="font-size:18px">${oldest?oldest.label:'-'}</div></div>`;
}

function drawTable(){
  const max=Math.max(1,...MONTHS.map(m=>m.q));
  let rows=MONTHS.map(m=>{
    const share=TOTQ?m.q/TOTQ:0, bw=Math.round((m.q/max)*90);
    return `<tr><td><b>${m.label}</b></td>
      <td class="num">${f3(m.q)}</td>
      <td class="num">${m.n}</td>
      <td class="num"><span class="bar" style="width:${bw}px;margin-right:6px;opacity:${m.q?0.85:0}"></span>${pct(share)}</td></tr>`;
  }).join('');
  if(NODATE.n){ const share=TOTQ?NODATE.q/TOTQ:0;
    rows+=`<tr><td><b>(no GRPO date)</b></td><td class="num">${f3(NODATE.q)}</td><td class="num">${NODATE.n}</td><td class="num">${pct(share)}</td></tr>`; }
  $('sub').textContent=`${TOTN} coils · ${f3(TOTQ)} MT`;
  $('tbl').innerHTML=MONTHS.length?`<table><thead><tr><th>Purchase month</th><th class="num">Available stock (MT)</th><th class="num">Coil count</th><th class="num">Share of stock</th></tr></thead><tbody>
    ${rows}
    <tr class="tot"><td>Total</td><td class="num">${f3(TOTQ)}</td><td class="num">${TOTN}</td><td class="num">100.0%</td></tr></tbody></table>`:'<div class="empty">No coil stock found.</div>';
}

function drawChart(){
  if(!MONTHS.length){ $('chart').innerHTML=''; return; }
  const n=MONTHS.length, bw=30, gap=14, padL=8, padR=8, padT=24, padB=40;
  const plotH=168, W=padL+padR+n*bw+(n-1)*gap, H=plotH+padT+padB;
  const max=Math.max(1,...MONTHS.map(m=>m.q)), scale=plotH/max;
  const col='#1367a6';
  let bars='';
  MONTHS.forEach((m,i)=>{
    const x=padL+i*(bw+gap), h=Math.round(m.q*scale), y=padT+plotH-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${col}"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-5}" font-size="11" font-weight="700" fill="#14202b" text-anchor="middle">${m.q?f3(m.q):''}</text>`;
    // two-line month label
    const parts=m.label.split(' ');
    bars+=`<text x="${x+bw/2}" y="${padT+plotH+16}" font-size="11" fill="#5b6b78" text-anchor="middle">${parts[0]}</text>`;
    bars+=`<text x="${x+bw/2}" y="${padT+plotH+30}" font-size="11" fill="#5b6b78" text-anchor="middle">${parts[1]}</text>`;
  });
  const baseY=padT+plotH;
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;font-family:system-ui,sans-serif">
    <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="#e3e8ec" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function dl(){
  const head=['Purchase Month','Available Stock (MT)','Coil Count','Share of Stock %'];
  const lines=MONTHS.map(m=>[m.label,m.q.toFixed(3),m.n,(TOTQ?(m.q/TOTQ*100):0).toFixed(1)].join(','));
  if(NODATE.n) lines.push(['(no GRPO date)',NODATE.q.toFixed(3),NODATE.n,(TOTQ?(NODATE.q/TOTQ*100):0).toFixed(1)].join(','));
  lines.push(['TOTAL',TOTQ.toFixed(3),TOTN,'100.0'].join(','));
  const csv=[head.join(',')].concat(lines).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='monthly_stock_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

(async function(){
  try{S=await loadStock();}catch(e){$('errbox').innerHTML='<div class="err">Couldn\'t load stock data.</div>';return;}
  build(); drawKpis(); drawTable(); drawChart();
  $('foot').textContent=`${S.COILS.length} coil batches · grouped by GRPO purchase month`;
})();
</script>
</body></html>
