<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wheels India — Stock Statement — Bharat Steel MIS</title><link rel="icon" type="image/png" href="BSC.png"/>
<script>window.PORTAL={module:'wheels',screen:'report'}</script>
<style>
  .sheet{background:#fff;border:1px solid #d0d7dd;border-radius:10px;overflow:hidden;margin:14px 0}
  .shdr{background:#0e2a47;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px}
  .shdr img{height:42px;background:#fff;padding:5px 8px;border-radius:4px}
  .shdr h1{margin:0;font-size:18px;font-weight:700}
  .shdr .sub{font-size:12px;opacity:.85;margin-top:3px}
  .smeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:11px 22px;background:#f7f9fb;border-bottom:1px solid #e3e8ec;font-size:13px}
  .smeta b{color:#0e2a47}
  .swrap{padding:14px 22px 4px}
  table.x{width:100%;border-collapse:collapse;font-size:12px}
  table.x th{padding:5px 8px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#556;background:#eef3f7}
  table.x th.l{text-align:left}
  table.x td{padding:5px 8px;border-bottom:1px solid #eef1f3}
  table.x td.r{text-align:right} table.x td.mono{font-family:var(--mono);font-size:11px}
  table.x td.sec{color:#fff;font-weight:700;padding:7px 10px;font-size:13px}
  table.x td.st{text-align:right;font-weight:700;padding:6px 10px;border-top:2px solid #333}
  .sgt{margin:14px 22px;padding:12px 16px;background:#0e2a47;color:#fff;border-radius:5px;display:flex;justify-content:space-between;font-size:15px;font-weight:700}
  .snote{margin:0 22px 14px;padding:9px 13px;background:#fff8e1;border:1px solid #f0dc9a;color:#6b5200;font-size:11px;border-radius:5px}
  .sfoot{padding:16px 22px;font-size:11px;color:#667;border-top:1px solid #e3e8ec;line-height:1.6}
  .wipbox{background:#fff;border:1px dashed #c9a; border-radius:10px;padding:12px 16px;margin:14px 0}
  .wipbox h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8a1c1c}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .toolbar .sp{margin-left:auto;display:flex;gap:8px}
</style>
</head><body>
<div class="pw">
  <div id="errbox"></div>

  <div class="toolbar">
    <label style="font-size:12px;color:var(--gray);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="showWip" onchange="draw()"/> show WIP-excluded items (internal only)
    </label>
    <div class="sp">
      <button class="pbtn" style="background:var(--blue);border-color:var(--blue)" onclick="window.print()">Print / Save PDF</button>
      <a class="pbtn" style="background:var(--blue);border-color:var(--blue);text-decoration:none" href="settings.html">Settings</a>
    </div>
  </div>

  <!-- A: current stock by brand -->
  <div class="card">
    <h3>Material held by brand <span class="r" id="byBrandSub"></span></h3>
    <div class="tblwrap" id="byBrand"></div>
  </div>

  <!-- B: worked (dispatched back) by brand -->
  <div class="card">
    <h3>Material worked for Wheels India <span class="r">dispatched back · MT</span></h3>
    <div class="filters" style="margin:0 0 10px">
      <label>Period
        <select id="workedPeriod" onchange="renderWorked()">
          <option value="fy">This FY</option>
          <option value="all">All time</option>
        </select>
      </label>
      <label>View
        <select id="workedView" onchange="renderWorked()">
          <option value="total">Total by brand</option>
          <option value="month">Month-wise by brand</option>
        </select>
      </label>
      <span class="fcount" id="workedSub"></span>
    </div>
    <div class="tblwrap" id="workedTbl"></div>
  </div>

  <div class="sheet" id="sheet"></div>
  <div class="wipbox" id="wipCard" style="display:none"></div>

  <footer id="foot"></footer>
</div>
<script src="../_portal.js"></script>
<script>
const SEC=[['COIL','Coil Stock','#1367a6'],['PLATE','Plate Stock','#0e7a4b'],['STRIP','Strip / Blank Stock','#b5651d'],['SCRAP','Scrap','#8a1c1c']];
let ROWS=[], WIP=new Set(), META={}, WORKED=[];
function formOf(name){const n=(name||'').toUpperCase();
  if(n.includes('SCRAP'))return 'SCRAP';
  if(n.includes('BLANK')||n.includes('FLAT')||n.includes('STRIP'))return 'STRIP';
  if(n.includes('PLATE'))return 'PLATE';
  if(n.includes('COIL'))return 'COIL';
  return 'OTHER';}
const gnum=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
const KNOWN_BRANDS=new Set(['JSW','WUHAN','AMNS','JSOL','HYUNDAI','TATA','SAIL','NMDC','POSCO','JINDAL']);
function brandNorm(name){const w=(name||'').trim().split(/\s+/)[0].toUpperCase();return KNOWN_BRANDS.has(w)?w:'Others';}
const fdim=v=>{const n=gnum(v);return n!==null?(''+ +n.toFixed(2)).replace(/\.00$/,''):'';};
const flen=v=>{const n=gnum(v);return (n&&n>0)?(''+ +n.toFixed(0)):'—';};

async function load(){
  try{
    const b='?t='+Date.now();
    const [csv,set,wk] = await Promise.all([
      fetch(DATA_BASE+'/wheels_stock.csv'+b).then(r=>{if(!r.ok)throw 0;return r.text();}),
      fetch(BASE+'/api/wheels?route=settings'+b).then(r=>r.ok?r.json():{wip:[],meta:{}}).catch(()=>({wip:[],meta:{}})),
      fetch(DATA_BASE+'/wheels_worked.csv'+b).then(r=>r.ok?r.text():'').catch(()=>'')
    ]);
    WORKED=parseCSV(wk).map(r=>({Brand:brandNorm(r.Brand),Yr:+r.Yr,Mth:+r.Mth,Qty:gnum(r.Qty)||0}));
    ROWS=parseCSV(csv).map(r=>({...r,Quantity:gnum(r.Quantity)||0,form:formOf(r.ItemName)}));
    WIP=new Set((set.wip||[]).map(String));
    const metaRaw=await fetch(DATA_BASE+'/wheels_meta.json'+b).then(r=>r.ok?r.json():{}).catch(()=>({}));
    META=metaRaw; setStamp(META.generated);
    draw();
    $('foot').textContent=`${ROWS.length} WH45 batches for Wheels India · WIP-excluded: ${ROWS.filter(r=>WIP.has(r.BatchNum)).length}`;
  }catch(e){ $('errbox').innerHTML='<div class="err">Couldn\'t load Wheels India stock — the refresh job may not have pushed yet.</div>'; }
}

function sectionTable(rows){
  let html='<div class="swrap"><table class="x">', gb=0, gq=0;
  for(const [key,title,col] of SEC){
    const rs=rows.filter(r=>r.form===key).sort((a,b)=>b.Quantity-a.Quantity);
    if(!rs.length) continue;
    const tq=rs.reduce((a,r)=>a+r.Quantity,0); gb+=rs.length; gq+=tq;
    html+=`<tr><td class="sec" colspan="10" style="background:${col}">${title}<span style="float:right">${rs.length} items · ${tq.toFixed(3)} MT</span></td></tr>
      <tr><th style="width:24px">#</th><th class="l">Mill</th><th class="l">Grade</th><th>Thk</th><th>Width</th><th>Length</th><th class="l">Coil / Batch No</th><th class="l">Mother Coil</th><th>Qty (MT)</th><th>Age (d)</th></tr>`;
    rs.forEach((x,i)=>{
      const mill=(x.ItemName||'').split(' ')[0];
      html+=`<tr><td class="r" style="color:#888">${i+1}</td><td>${esc(mill)}</td><td>${esc(x.Grade)}</td>
        <td class="r">${fdim(x.Thick)}</td><td class="r">${fdim(x.Width)}</td><td class="r">${flen(x.Length)}</td>
        <td class="mono">${esc(x.CoilNo||x.BatchNum)}${(+x.BatchCount>1)?` <span style=\"color:#999\">(${x.BatchCount} batches)</span>`:''}</td><td class="mono" style="color:#999">${esc(x.Mothercoil||'—')}</td>
        <td class="r" style="font-weight:600">${x.Quantity.toFixed(3)}</td><td class="r" style="color:#888">${esc(x.AgeDays)}</td></tr>`;
    });
    html+=`<tr><td class="st" colspan="8">${title} total</td><td class="st r">${tq.toFixed(3)}</td><td class="st"></td></tr>`;
  }
  html+='</table></div>';
  return {html,gb,gq};
}

function fyOf(y,m){return m>=4?y:y-1;}
function renderByBrand(){
  const visible=ROWS.filter(r=>!WIP.has(r.BatchNum));
  const forms=['COIL','PLATE','STRIP','SCRAP'];
  const b={};
  visible.forEach(r=>{const br=brandNorm(r.ItemName);(b[br]??={COIL:0,PLATE:0,STRIP:0,SCRAP:0,tot:0});b[br][r.form]+=r.Quantity;b[br].tot+=r.Quantity;});
  const brands=Object.keys(b).sort((x,y)=>b[y].tot-b[x].tot);
  const gt=brands.reduce((a,k)=>a+b[k].tot,0);
  $('byBrandSub').textContent=`${brands.length} brands · ${gt.toFixed(3)} MT`;
  $('byBrand').innerHTML=brands.length?`<table class="x" style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px 10px">Brand</th><th style="text-align:right;padding:6px 10px">Coil</th><th style="text-align:right;padding:6px 10px">Plate</th><th style="text-align:right;padding:6px 10px">Strip</th><th style="text-align:right;padding:6px 10px">Scrap</th><th style="text-align:right;padding:6px 10px">Total (MT)</th></tr></thead><tbody>
    ${brands.map(k=>`<tr><td style="padding:5px 10px;border-top:1px solid #eef1f3"><b>${esc(k)}</b></td>${forms.map(f=>`<td style="padding:5px 10px;text-align:right;border-top:1px solid #eef1f3">${b[k][f]?b[k][f].toFixed(3):''}</td>`).join('')}<td style="padding:5px 10px;text-align:right;font-weight:700;border-top:1px solid #eef1f3">${b[k].tot.toFixed(3)}</td></tr>`).join('')}
    <tr><td style="padding:6px 10px;border-top:2px solid #333;font-weight:700">Total</td>${forms.map(f=>`<td style="padding:6px 10px;text-align:right;border-top:2px solid #333;font-weight:700">${brands.reduce((a,k)=>a+b[k][f],0).toFixed(3)}</td>`).join('')}<td style="padding:6px 10px;text-align:right;border-top:2px solid #333;font-weight:700">${gt.toFixed(3)}</td></tr>
    </tbody></table>`:'<div class="empty">No stock.</div>';
}
const MONTHS=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
function renderWorked(){
  const period=$('workedPeriod').value, view=$('workedView').value;
  const now=new Date(), curFy=fyOf(now.getFullYear(),now.getMonth()+1);
  let rows=WORKED;
  if(period==='fy') rows=rows.filter(r=>fyOf(r.Yr,r.Mth)===curFy);
  const brands=[...new Set(rows.map(r=>r.Brand))];
  const brandTot={}; rows.forEach(r=>brandTot[r.Brand]=(brandTot[r.Brand]||0)+r.Qty);
  const ordered=Object.keys(brandTot).sort((a,b)=>brandTot[b]-brandTot[a]);
  const gt=ordered.reduce((a,k)=>a+brandTot[k],0);
  $('workedSub').textContent=`${gt.toFixed(3)} MT dispatched`;
  if(!ordered.length){$('workedTbl').innerHTML='<div class="empty">No dispatch history.</div>';return;}
  if(view==='total'){
    $('workedTbl').innerHTML=`<table class="x" style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px 10px">Brand</th><th style="text-align:right;padding:6px 10px">Dispatched (MT)</th><th style="text-align:right;padding:6px 10px">Share</th></tr></thead><tbody>
      ${ordered.map(k=>`<tr><td style="padding:5px 10px;border-top:1px solid #eef1f3"><b>${esc(k)}</b></td><td style="padding:5px 10px;text-align:right;border-top:1px solid #eef1f3">${brandTot[k].toFixed(3)}</td><td style="padding:5px 10px;text-align:right;border-top:1px solid #eef1f3">${gt?(brandTot[k]/gt*100).toFixed(1):0}%</td></tr>`).join('')}
      <tr><td style="padding:6px 10px;border-top:2px solid #333;font-weight:700">Total</td><td style="padding:6px 10px;text-align:right;border-top:2px solid #333;font-weight:700">${gt.toFixed(3)}</td><td style="border-top:2px solid #333"></td></tr></tbody></table>`;
  } else {
    // month-wise: for the FY, columns Apr..Mar; for all-time, group by Yr-Mon labels present
    let cols;
    if(period==='fy'){ cols=MONTHS.map((m,i)=>({key:i,label:m})); }
    else { const set=new Set(rows.map(r=>r.Yr*100+r.Mth)); cols=[...set].sort().map(v=>({key:v,label:MONTHS[((Math.floor(v%100))+8)%12]+' '+String(Math.floor(v/100)).slice(2)})); }
    const cell={}; rows.forEach(r=>{const k=period==='fy'?((r.Mth+8)%12):(r.Yr*100+r.Mth);(cell[r.Brand]??={})[k]=(cell[r.Brand][k]||0)+r.Qty;});
    const colTot={};
    $('workedTbl').innerHTML=`<div style="overflow-x:auto"><table class="x" style="border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:5px 8px">Brand</th>${cols.map(c=>`<th style="text-align:right;padding:5px 8px">${c.label}</th>`).join('')}<th style="text-align:right;padding:5px 8px">Total</th></tr></thead><tbody>
      ${ordered.map(k=>{const rt=brandTot[k];return `<tr><td style="padding:4px 8px;border-top:1px solid #eef1f3"><b>${esc(k)}</b></td>${cols.map(c=>{const v=(cell[k]||{})[c.key]||0;colTot[c.key]=(colTot[c.key]||0)+v;return `<td style="padding:4px 8px;text-align:right;border-top:1px solid #eef1f3">${v?v.toFixed(1):''}</td>`;}).join('')}<td style="padding:4px 8px;text-align:right;font-weight:700;border-top:1px solid #eef1f3">${rt.toFixed(1)}</td></tr>`;}).join('')}
      <tr><td style="padding:5px 8px;border-top:2px solid #333;font-weight:700">Total</td>${cols.map(c=>`<td style="padding:5px 8px;text-align:right;border-top:2px solid #333;font-weight:700">${(colTot[c.key]||0).toFixed(1)}</td>`).join('')}<td style="padding:5px 8px;text-align:right;border-top:2px solid #333;font-weight:700">${gt.toFixed(1)}</td></tr>
      </tbody></table></div>`;
  }
}
function draw(){
  const showWip=$('showWip').checked;
  const visible=ROWS.filter(r=>!WIP.has(r.BatchNum));
  const {html,gb,gq}=sectionTable(visible);
  const asof=$('pStamp').textContent.replace('as of ','') || new Date().toLocaleString('en-IN');
  $('sheet').innerHTML=`
    <div class="shdr"><img src="BSC.png" alt="BSC" onerror="this.style.display='none'"/>
      <div><h1>Job Work Stock Statement — Wheels India Limited</h1>
      <div class="sub">Bharat Steel (Chennai) Pvt. Ltd. · Material held at BSC on customer's account</div></div></div>
    <div class="smeta"><div>Customer: <b>Wheels India Limited</b></div><div>As on: <b>${esc(asof)}</b></div><div>Warehouse: <b>Job Work (WH 45)</b></div></div>
    ${html}
    <div class="sgt"><span>TOTAL MATERIAL HELD</span><span>${gb} items · ${gq.toFixed(3)} MT</span></div>
    <div class="snote">⚠ Plates currently under process (awaiting shearing) are excluded from this statement — WIP items are not shown as available stock.</div>
    <div class="sfoot"><b>Bharat Steel (Chennai) Pvt. Ltd.</b> · No.147, Survey No.133, Thirunilai Village, Ponneri Taluk, Chennai 600103 · 044 6791 7800 · info@bharatsteels.in<br>
      System-generated statement of your material held at BSC as on the date/time shown. Figures drawn live from our ERP. For queries contact your account manager.</div>`;
  // internal WIP card
  renderByBrand(); renderWorked();
  const wipRows=ROWS.filter(r=>WIP.has(r.BatchNum));
  if(showWip && wipRows.length){
    const tq=wipRows.reduce((a,r)=>a+r.Quantity,0);
    $('wipCard').style.display='';
    $('wipCard').innerHTML=`<h3>WIP-excluded items — internal only, NOT sent to customer (${wipRows.length} · ${tq.toFixed(3)} MT)</h3>
      <div class="tblwrap"><table class="x"><tr><th class="l">Item</th><th class="l">Batch</th><th>Thk</th><th>Width</th><th>Length</th><th>Qty (MT)</th></tr>
      ${wipRows.map(x=>`<tr><td>${esc(x.ItemName)}</td><td class="mono">${esc(x.BatchNum)}</td><td class="r">${fdim(x.Thick)}</td><td class="r">${fdim(x.Width)}</td><td class="r">${flen(x.Length)}</td><td class="r">${x.Quantity.toFixed(3)}</td></tr>`).join('')}
      </table></div><div class="muted" style="margin-top:6px">Manage exclusions on the <a href="settings.html">Settings</a> page.</div>`;
  } else { $('wipCard').style.display='none'; }
}
load();
</script>
</body></html>
