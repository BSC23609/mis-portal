<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wheels India — Stock Statement — Bharat Steel MIS</title><link rel="icon" type="image/png" href="BSC.png"/>
<script>window.PORTAL={module:'wheels',screen:'report'}</script>
<style>
  .sheet{background:#fff;border:1px solid #d0d7dd;border-radius:10px;overflow:hidden;margin:14px 0}
  .shdr{background:#0e2a47;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px}
  .shdr img{height:42px;background:#fff;padding:5px 8px;border-radius:4px}
  .shdr h1{margin:0;font-size:18px;font-weight:700}
  .shdr .sub{font-size:12px;opacity:.85;margin-top:3px}
  .smeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:11px 22px;background:#f7f9fb;border-bottom:1px solid #e3e8ec;font-size:13px}
  .smeta b{color:#0e2a47}
  .swrap{padding:14px 22px 4px}
  table.x{width:100%;border-collapse:collapse;font-size:12px}
  table.x th{padding:5px 8px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#556;background:#eef3f7}
  table.x th.l{text-align:left}
  table.x td{padding:5px 8px;border-bottom:1px solid #eef1f3}
  table.x td.r{text-align:right} table.x td.mono{font-family:var(--mono);font-size:11px}
  table.x td.sec{color:#fff;font-weight:700;padding:7px 10px;font-size:13px}
  table.x td.st{text-align:right;font-weight:700;padding:6px 10px;border-top:2px solid #333}
  .sgt{margin:14px 22px;padding:12px 16px;background:#0e2a47;color:#fff;border-radius:5px;display:flex;justify-content:space-between;font-size:15px;font-weight:700}
  .snote{margin:0 22px 14px;padding:9px 13px;background:#fff8e1;border:1px solid #f0dc9a;color:#6b5200;font-size:11px;border-radius:5px}
  .sfoot{padding:16px 22px;font-size:11px;color:#667;border-top:1px solid #e3e8ec;line-height:1.6}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .toolbar .sp{margin-left:auto;display:flex;gap:8px}
  .tabbar{display:flex;gap:6px;margin:14px 0 0}
  .tabbtn{background:#fff;border:1px solid #cdd6df;color:#0e2a47;border-radius:7px;padding:7px 16px;font-weight:600;cursor:pointer}
  .tabbtn.active{background:#0e2a47;border-color:#0e2a47;color:#fff}
  #coilBody td.srcc{background:#eef3f7;font-weight:700;vertical-align:top;border-right:2px solid #cdd6df;white-space:nowrap}
  #coilBody select{padding:6px 8px;border:1px solid #cdd6df;border-radius:6px;font-size:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head><body>
<div class="pw">
  <div id="errbox"></div>

  <div class="tabbar">
    <button class="tabbtn active" id="tabbtn-stock" onclick="showTab('stock')">Stock Statement</button>
    <button class="tabbtn" id="tabbtn-prod" onclick="showTab('prod')">Production Report</button>
    <button class="tabbtn" id="tabbtn-coil" onclick="showTab('coil')">By Source Coil</button>
  </div>

  <div id="tabStock">
  <div class="toolbar">
    <label style="font-size:12px;color:var(--gray);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="hideSmall" onchange="onHideSmall()"/> hide plate &lt;0.1 &amp; strip &lt;0.011 MT
    </label>
    <div class="sp">
      <button class="pbtn" style="background:var(--blue);border-color:var(--blue)" onclick="window.print()">Print / Save PDF</button>
      <a class="pbtn" style="background:var(--blue);border-color:var(--blue);text-decoration:none" href="settings.html">Settings</a>
    </div>
  </div>

  <!-- A: current stock by brand -->
  <div class="card">
    <h3>Material held by brand <span class="r" id="byBrandSub"></span></h3>
    <div class="tblwrap" id="byBrand"></div>
  </div>

  <!-- B: worked (dispatched back) by brand -->
  <div class="card">
    <h3>Material worked for Wheels India <span class="r">dispatched back · MT</span></h3>
    <div class="filters" style="margin:0 0 10px">
      <label>Period
        <select id="workedPeriod" onchange="renderWorked()">
          <option value="fy">This FY</option>
          <option value="all">All time</option>
        </select>
      </label>
      <label>View
        <select id="workedView" onchange="renderWorked()">
          <option value="total">Total by brand</option>
          <option value="month">Month-wise by brand</option>
        </select>
      </label>
      <span class="fcount" id="workedSub"></span>
    </div>
    <div class="tblwrap" id="workedTbl"></div>
  </div>

  <div class="sheet" id="sheet"></div>
  </div><!-- /tabStock -->

  <div id="tabProd" style="display:none">
    <div class="toolbar"><div class="sp">
      <button class="pbtn" style="background:var(--blue);border-color:var(--blue)" onclick="window.print()">Print / Save PDF</button>
      <a class="pbtn" style="background:var(--blue);border-color:var(--blue);text-decoration:none" href="settings.html">Settings</a>
    </div></div>
    <div class="card">
      <h3>Total Production Report <span class="r" id="prodRepSub"></span></h3>
      <div class="tblwrap" id="prodTotal"></div>
    </div>
    <div class="card">
      <h3>Wheels India Production Report <span class="r">WIR grades · MT</span></h3>
      <div class="tblwrap" id="prodWheels"></div>
    </div>
    <div class="card">
      <h3>Wheels India Monthly Production Report <span class="r">current year · MT</span></h3>
      <div class="tblwrap" id="prodMonthly"></div>
    </div>
  </div>

  <div id="tabCoil" style="display:none">
    <div class="toolbar">
      <label style="font-size:12px;color:var(--gray);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="coilOnlyStock" checked onchange="renderByCoil()"/> only coils with stock
      </label>
      <select id="coilStatus" onchange="renderByCoil()" style="padding:6px 8px;border:1px solid #cdd6df;border-radius:6px;font-size:12px">
        <option value="">All statuses</option><option value="In Whs">In Whs</option><option value="Processed">Processed</option><option value="Delivered">Delivered</option>
      </select>
      <select id="coilMill" onchange="renderByCoil()" style="padding:6px 8px;border:1px solid #cdd6df;border-radius:6px;font-size:12px"><option value="">All mills</option></select>
      <input id="coilSearch" placeholder="search coil / batch no" oninput="renderByCoil()" style="padding:6px 10px;border:1px solid #cdd6df;border-radius:6px;font-size:12px;min-width:180px"/>
      <div class="sp">
        <button class="pbtn" style="background:#0e7a4b;border-color:#0e7a4b" onclick="exportCoilExcel()">Download Excel</button>
        <button class="pbtn" style="background:var(--blue);border-color:var(--blue)" onclick="window.print()">Print / Save PDF</button>
      </div>
    </div>
    <div id="coilBody"></div>
  </div>

  <footer id="foot"></footer>
</div>
<script src="../_portal.js"></script>
<script>
const SEC=[['COIL','Coil Stock','#1367a6'],['PLATE','Plate Stock (WIP / FG)','#0e7a4b'],['ENDBITP','Plate-End Bit','#5b6670'],['STRIP','Strip / Blank Stock','#b5651d'],['ENDBITS','Strip-End Bit','#7a4e24'],['SCRAP','Scrap','#8a1c1c']];
const SMALL_PLATE=0.1, SMALL_STRIP=0.011;   // plate below 0.1 MT & strip below 0.011 MT hidden when the filter is on
let ROWS=[], META={}, WORKED=[], PRODDAILY=[], HOLIDAYS=[], TRACE=[];
function showTab(t){
  if(!['stock','prod','coil'].includes(t)) t='stock';
  $('tabStock').style.display = t==='stock'?'':'none';
  $('tabProd').style.display  = t==='prod' ?'':'none';
  $('tabCoil').style.display  = t==='coil' ?'':'none';
  $('tabbtn-stock').classList.toggle('active', t==='stock');
  $('tabbtn-prod').classList.toggle('active', t==='prod');
  $('tabbtn-coil').classList.toggle('active', t==='coil');
  try{ localStorage.setItem('wheelsTab', t); }catch(e){}
}
// rows to display: optionally drop plate/strip under 0.1 MT
function viewRows(){
  if(!$('hideSmall').checked) return ROWS;
  return ROWS.filter(r=>!(((r.form==='PLATE'||r.form==='ENDBITP')&&r.Quantity<SMALL_PLATE)||((r.form==='STRIP'||r.form==='ENDBITS')&&r.Quantity<SMALL_STRIP)));
}
function onHideSmall(){
  try{ localStorage.setItem('wheelsHideSmall', $('hideSmall').checked?'1':'0'); }catch(e){}
  draw();
}
function formOf(name){const n=(name||'').toUpperCase();
  if(n.includes('SCRAP'))return 'SCRAP';
  if(n.includes('BLANK')||n.includes('FLAT')||n.includes('STRIP'))return 'STRIP';
  if(n.includes('PLATE'))return 'PLATE';
  if(n.includes('COIL'))return 'COIL';
  return 'OTHER';}
// end-bit = a Plate/Strip row with no usable Length ("—"); shown in its own section but still counted under its base form in brand totals
function baseForm(f){return f==='ENDBITP'?'PLATE':f==='ENDBITS'?'STRIP':f;}
const gnum=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
const KNOWN_BRANDS=new Set(['JSW','WUHAN','AMNS','JSOL','HYUNDAI','TATA','SAIL','NMDC','POSCO','JINDAL']);
function brandNorm(name){const w=(name||'').trim().split(/\s+/)[0].toUpperCase();return KNOWN_BRANDS.has(w)?w:'Others';}
const fdim=v=>{const n=gnum(v);return n!==null?(''+ +n.toFixed(2)).replace(/\.00$/,''):'';};
const flen=v=>{const n=gnum(v);return (n&&n>0)?(''+ +n.toFixed(0)):'—';};

async function load(){
  // default ON (hide sub-0.1 MT plate/strip); remember the user's choice per browser
  try{ $('hideSmall').checked = (localStorage.getItem('wheelsHideSmall') ?? '1') !== '0'; }
  catch(e){ $('hideSmall').checked = true; }
  try{
    const b='?t='+Date.now();
    const [csv,wk,pday,setJson,trc] = await Promise.all([
      fetch(DATA_BASE+'/wheels_stock.csv'+b).then(r=>{if(!r.ok)throw 0;return r.text();}),
      fetch(DATA_BASE+'/wheels_worked.csv'+b).then(r=>r.ok?r.text():'').catch(()=>''),
      fetch(DATA_BASE+'/wheels_proddaily.csv'+b).then(r=>r.ok?r.text():'').catch(()=>''),
      fetch(BASE+'/api/wheels?route=settings'+b).then(r=>r.ok?r.json():{}).catch(()=>({})),
      fetch(DATA_BASE+'/wheels_traceability.csv'+b).then(r=>r.ok?r.text():'').catch(()=>'')
    ]);
    WORKED=parseCSV(wk).map(r=>({Brand:brandNorm(r.Brand),Yr:+r.Yr,Mth:+r.Mth,Qty:gnum(r.Qty)||0}));
    PRODDAILY=parseCSV(pday); HOLIDAYS=(setJson&&setJson.holidays)||[]; TRACE=parseCSV(trc);
    ROWS=parseCSV(csv).map(r=>{const q=gnum(r.Quantity)||0;let form=formOf(r.ItemName);const noLen=!(gnum(r.Length)>0);if(form==='PLATE'&&noLen)form='ENDBITP';else if(form==='STRIP'&&noLen)form='ENDBITS';return {...r,Quantity:q,form};});
    const metaRaw=await fetch(DATA_BASE+'/wheels_meta.json'+b).then(r=>r.ok?r.json():{}).catch(()=>({}));
    META=metaRaw; setStamp(META.generated);
    draw();
    $('foot').textContent=`${ROWS.length} WH45 batches for Wheels India`;
  }catch(e){ $('errbox').innerHTML='<div class="err">Couldn\'t load Wheels India stock — the refresh job may not have pushed yet.</div>'; }
}

function sectionTable(rows){
  let html='<div class="swrap"><table class="x">', gb=0, gq=0;
  for(const [key,title,col] of SEC){
    const _n=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
    const _cmp=(a,b)=>(_n(b.AgeDays)-_n(a.AgeDays))||(_n(b.Thick)-_n(a.Thick))||(b.Quantity-a.Quantity); // every section: oldest (Aging) first
    const rs=rows.filter(r=>r.form===key).sort(_cmp);
    if(!rs.length) continue;
    const tq=rs.reduce((a,r)=>a+r.Quantity,0); gb+=rs.length; gq+=tq;
    html+=`<tr><td class="sec" colspan="10" style="background:${col}">${title}<span style="float:right">${rs.length} items · ${tq.toFixed(3)} MT</span></td></tr>
      <tr><th style="width:24px">#</th><th class="l">Mill</th><th class="l">Grade</th><th>Thk</th><th>Width</th><th>Length</th><th class="l">Coil / Batch No</th><th class="l">Mother Coil</th><th>Qty (MT)</th><th>Age (d)</th></tr>`;
    rs.forEach((x,i)=>{
      const mill=(x.ItemName||'').split(' ')[0];
      const thr=key==="PLATE"?5:(key==="ENDBITP"||key==="ENDBITS")?10:null;   // Plate >=5; Plate-End Bit & Strip-End Bit >=10 -> red AGING CELL only
      const old=thr!==null && (parseInt(x.AgeDays)||0)>=thr;
      const ageS=old?'color:#c0392b;font-weight:700;background:#fdecea':'color:#888';
      html+=`<tr><td class="r" style="color:#888">${i+1}</td><td>${esc(mill)}</td><td>${esc(x.Grade)}</td>
        <td class="r">${fdim(x.Thick)}</td><td class="r">${fdim(x.Width)}</td><td class="r">${(key==='ENDBITP'||key==='ENDBITS')?'<b>EB</b>':flen(x.Length)}</td>
        <td class="mono">${esc(x.CoilNo||x.BatchNum)}${(+x.BatchCount>1)?` <span style=\"color:#999\">(${x.BatchCount} batches)</span>`:''}</td><td class="mono" style="color:#999">${esc(x.Mothercoil||'—')}</td>
        <td class="r" style="font-weight:600">${x.Quantity.toFixed(3)}</td><td class="r" style="${ageS}">${esc(x.AgeDays)}</td></tr>`;
    });
    html+=`<tr><td class="st" colspan="8">${title} total</td><td class="st r">${tq.toFixed(3)}</td><td class="st"></td></tr>`;
  }
  html+='</table></div>';
  return {html,gb,gq};
}

function fyOf(y,m){return m>=4?y:y-1;}
function renderByBrand(){
  const visible=viewRows();
  const forms=['COIL','PLATE','STRIP','SCRAP'];
  const b={};
  visible.forEach(r=>{const br=brandNorm(r.ItemName);const f=baseForm(r.form);(b[br]??={COIL:0,PLATE:0,STRIP:0,SCRAP:0,tot:0});b[br][f]+=r.Quantity;b[br].tot+=r.Quantity;});
  const brands=Object.keys(b).sort((x,y)=>b[y].tot-b[x].tot);
  const gt=brands.reduce((a,k)=>a+b[k].tot,0);
  $('byBrandSub').textContent=`${brands.length} brands · ${gt.toFixed(3)} MT`;
  $('byBrand').innerHTML=brands.length?`<table class="x" style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px 10px">Brand</th><th style="text-align:right;padding:6px 10px">Coil</th><th style="text-align:right;padding:6px 10px">Plate</th><th style="text-align:right;padding:6px 10px">Strip</th><th style="text-align:right;padding:6px 10px">Scrap</th><th style="text-align:right;padding:6px 10px">Total (MT)</th></tr></thead><tbody>
    ${brands.map(k=>`<tr><td style="padding:5px 10px;border-top:1px solid #eef1f3"><b>${esc(k)}</b></td>${forms.map(f=>`<td style="padding:5px 10px;text-align:right;border-top:1px solid #eef1f3">${b[k][f]?b[k][f].toFixed(3):''}</td>`).join('')}<td style="padding:5px 10px;text-align:right;font-weight:700;border-top:1px solid #eef1f3">${b[k].tot.toFixed(3)}</td></tr>`).join('')}
    <tr><td style="padding:6px 10px;border-top:2px solid #333;font-weight:700">Total</td>${forms.map(f=>`<td style="padding:6px 10px;text-align:right;border-top:2px solid #333;font-weight:700">${brands.reduce((a,k)=>a+b[k][f],0).toFixed(3)}</td>`).join('')}<td style="padding:6px 10px;text-align:right;border-top:2px solid #333;font-weight:700">${gt.toFixed(3)}</td></tr>
    </tbody></table>`:'<div class="empty">No stock.</div>';
}
const MONTHS=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
function renderWorked(){
  const period=$('workedPeriod').value, view=$('workedView').value;
  const now=new Date(), curFy=fyOf(now.getFullYear(),now.getMonth()+1);
  let rows=WORKED;
  if(period==='fy') rows=rows.filter(r=>fyOf(r.Yr,r.Mth)===curFy);
  const brands=[...new Set(rows.map(r=>r.Brand))];
  const brandTot={}; rows.forEach(r=>brandTot[r.Brand]=(brandTot[r.Brand]||0)+r.Qty);
  const ordered=Object.keys(brandTot).sort((a,b)=>brandTot[b]-brandTot[a]);
  const gt=ordered.reduce((a,k)=>a+brandTot[k],0);
  $('workedSub').textContent=`${gt.toFixed(3)} MT dispatched`;
  if(!ordered.length){$('workedTbl').innerHTML='<div class="empty">No dispatch history.</div>';return;}
  if(view==='total'){
    $('workedTbl').innerHTML=`<table class="x" style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px 10px">Brand</th><th style="text-align:right;padding:6px 10px">Dispatched (MT)</th><th style="text-align:right;padding:6px 10px">Share</th></tr></thead><tbody>
      ${ordered.map(k=>`<tr><td style="padding:5px 10px;border-top:1px solid #eef1f3"><b>${esc(k)}</b></td><td style="padding:5px 10px;text-align:right;border-top:1px solid #eef1f3">${brandTot[k].toFixed(3)}</td><td style="padding:5px 10px;text-align:right;border-top:1px solid #eef1f3">${gt?(brandTot[k]/gt*100).toFixed(1):0}%</td></tr>`).join('')}
      <tr><td style="padding:6px 10px;border-top:2px solid #333;font-weight:700">Total</td><td style="padding:6px 10px;text-align:right;border-top:2px solid #333;font-weight:700">${gt.toFixed(3)}</td><td style="border-top:2px solid #333"></td></tr></tbody></table>`;
  } else {
    // month-wise: for the FY, columns Apr..Mar; for all-time, group by Yr-Mon labels present
    let cols;
    if(period==='fy'){ cols=MONTHS.map((m,i)=>({key:i,label:m})); }
    else { const set=new Set(rows.map(r=>r.Yr*100+r.Mth)); cols=[...set].sort().map(v=>({key:v,label:MONTHS[((Math.floor(v%100))+8)%12]+' '+String(Math.floor(v/100)).slice(2)})); }
    const cell={}; rows.forEach(r=>{const k=period==='fy'?((r.Mth+8)%12):(r.Yr*100+r.Mth);(cell[r.Brand]??={})[k]=(cell[r.Brand][k]||0)+r.Qty;});
    const colTot={};
    $('workedTbl').innerHTML=`<div style="overflow-x:auto"><table class="x" style="border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:5px 8px">Brand</th>${cols.map(c=>`<th style="text-align:right;padding:5px 8px">${c.label}</th>`).join('')}<th style="text-align:right;padding:5px 8px">Total</th></tr></thead><tbody>
      ${ordered.map(k=>{const rt=brandTot[k];return `<tr><td style="padding:4px 8px;border-top:1px solid #eef1f3"><b>${esc(k)}</b></td>${cols.map(c=>{const v=(cell[k]||{})[c.key]||0;colTot[c.key]=(colTot[c.key]||0)+v;return `<td style="padding:4px 8px;text-align:right;border-top:1px solid #eef1f3">${v?v.toFixed(1):''}</td>`;}).join('')}<td style="padding:4px 8px;text-align:right;font-weight:700;border-top:1px solid #eef1f3">${rt.toFixed(1)}</td></tr>`;}).join('')}
      <tr><td style="padding:5px 8px;border-top:2px solid #333;font-weight:700">Total</td>${cols.map(c=>`<td style="padding:5px 8px;text-align:right;border-top:2px solid #333;font-weight:700">${(colTot[c.key]||0).toFixed(1)}</td>`).join('')}<td style="padding:5px 8px;text-align:right;border-top:2px solid #333;font-weight:700">${gt.toFixed(1)}</td></tr>
      </tbody></table></div>`;
  }
}
const PMON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PMACHS=[['MACHINE02 (MDS)','CTL 01-06 MM (MDS)'],['MACHINE01 (MDS)','CTL 6-25 MM (MDS)'],['MACHINE15 (MDS)','Shearing 06-25 MM (MDS)']];
const isoL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ddmmL=d=>String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
const pf=n=>String(Math.round(n||0)); // whole numbers (MT), rounded
// last working day strictly before today, skipping Sundays + holidays
function lastWD(hol){const h=new Set((hol||[]).map(s=>String(s).slice(0,10)));let b=new Date();b.setHours(12,0,0,0);do{b.setDate(b.getDate()-1);}while(b.getDay()===0||h.has(isoL(b)));return b;}
function ptable(headers,rows,grand){
  let h='<div style="overflow-x:auto"><table class="x" style="width:100%;border-collapse:collapse;text-align:center"><thead><tr>';
  headers.forEach(hd=> h+=`<th style="white-space:normal;text-align:center">${esc(hd)}</th>`);
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{ h+=`<tr><td style="border-top:1px solid #eef1f3;padding:5px 10px;text-align:center">${esc(r.label)}</td>`+r.vals.map(v=>`<td style="border-top:1px solid #eef1f3;padding:5px 10px;text-align:center">${v}</td>`).join('')+'</tr>'; });
  h+=`<tr style="background:#0e2a47;color:#fff;font-weight:700"><td style="color:#fff;padding:6px 10px;text-align:center">${esc(grand.label)}</td>`+grand.vals.map(v=>`<td style="padding:6px 10px;text-align:center">${v}</td>`).join('')+'</tr>';
  return h+'</tbody></table></div>';
}
function renderProdReport(){
  if(!PRODDAILY.length){ $('prodTotal').innerHTML='<div class="empty">No production data yet — the refresh job may not have pushed it.</div>'; $('prodWheels').innerHTML=''; $('prodMonthly').innerHTML=''; $('prodRepSub').textContent=''; return; }
  const R=PRODDAILY.map(r=>({ds:String(r['Date']||'').slice(0,10),mc:String(r['Machine']||'').trim(),tot:gnum(r['Total Qty'])||0,wh:gnum(r['Wheels Qty'])||0})).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.ds));
  const base=lastWD(HOLIDAYS), bISO=isoL(base), bY=base.getFullYear(), bM=base.getMonth(), bD=base.getDate();
  const monStart=isoL(new Date(bY,bM,1)), yrStart=isoL(new Date(bY,0,1));
  let ly=bY,lmo=bM-1; if(lmo<0){lmo=11;ly--;}
  const dim=new Date(ly,lmo+1,0).getDate(), lmDay=Math.min(bD,dim);
  const lmStart=isoL(new Date(ly,lmo,1)), lmEndDt=new Date(ly,lmo,lmDay), lmEnd=isoL(lmEndDt);
  const sum=(fld,mc,from,to)=>R.reduce((a,r)=>{ if(mc&&r.mc!==mc)return a; if(from&&r.ds<from)return a; if(to&&r.ds>to)return a; return a+r[fld]; },0);
  const onL='Production on '+ddmmL(base), monL=PMON[bM]+' '+bY+' upto '+ddmmL(base), lmL='Last month upto '+ddmmL(lmEndDt), yrL='This Year upto '+ddmmL(base);
  // Section A — total (all grades)
  let tg=[0,0,0];
  const trows=PMACHS.map(([c,nm])=>{const on=sum('tot',c,bISO,bISO),mo=sum('tot',c,monStart,bISO),lm=sum('tot',c,lmStart,lmEnd);tg[0]+=on;tg[1]+=mo;tg[2]+=lm;return{label:nm,vals:[pf(on),pf(mo),pf(lm)]};});
  $('prodTotal').innerHTML=ptable(['Machine',onL,monL,lmL],trows,{label:'GRAND TOTAL',vals:tg.map(pf)});
  // Section B — Wheels India (WIR grades)
  let wg=[0,0,0,0];
  const wrows=PMACHS.map(([c,nm])=>{const on=sum('wh',c,bISO,bISO),mo=sum('wh',c,monStart,bISO),lm=sum('wh',c,lmStart,lmEnd),yr=sum('wh',c,yrStart,bISO);wg[0]+=on;wg[1]+=mo;wg[2]+=lm;wg[3]+=yr;return{label:nm,vals:[pf(on),pf(mo),pf(lm),pf(yr)]};});
  $('prodWheels').innerHTML=ptable(['Machine',onL,monL,lmL,yrL],wrows,{label:'GRAND TOTAL',vals:wg.map(pf)});
  // Section C — Wheels India monthly (WIR)
  const mset=R.filter(r=>r.wh!==0&&r.ds>=yrStart).map(r=>+r.ds.slice(5,7));
  let firstM=mset.length?Math.min(...mset):(bM+1);
  let mg=[0,0,0], mgt=0; const mrows=[];
  for(let mm=firstM;mm<=bM+1;mm++){ const from=isoL(new Date(bY,mm-1,1)), to=isoL(new Date(bY,mm,0)); const c=PMACHS.map(([cc])=>sum('wh',cc,from,to)); const t=c.reduce((a,b)=>a+b,0); c.forEach((v,i)=>mg[i]+=v); mgt+=t; mrows.push({label:PMON[mm-1]+' '+bY,vals:[...c.map(pf),pf(t)]}); }
  $('prodMonthly').innerHTML=ptable(['Month',PMACHS[0][1],PMACHS[1][1],PMACHS[2][1],'Total'],mrows,{label:'TOTAL',vals:[...mg.map(pf),pf(mgt)]});
  $('prodRepSub').textContent='Machine-wise · Qty in MT · as on '+ddmmL(base);
}
// ---- By Source Coil (traceability): current plates/strips/scrap grouped by their mother coil ----
// Source coil = the mother coil with slit suffixes (-A, -B, -A-B) rolled up to the parent.
// ===== By Source Coil - lifecycle traceability (wide view) =====
// Feed: wheels_traceability.csv - one row per WH45 WIR batch with InWhsQty / DeliveredQty / ProcessedQty.
const CLS=[['COIL','Coil','#1367a6'],['PLATE','Plate','#0e7a4b'],['PLATESCRAP','Plate-Scrap','#9a6a1c'],['STRIP','Strip','#0e7a4b'],['STRIPSCRAP','Strip-Scrap','#8a1c1c']];
function clsOf(name){const n=(name||'').toUpperCase();
  const scrap=n.includes('SCRAP'), strip=n.includes('BLANK')||n.includes('FLAT')||n.includes('STRIP');
  if(scrap) return strip?'STRIPSCRAP':'PLATESCRAP';
  if(strip) return 'STRIP';
  if(n.includes('PLATE')) return 'PLATE';
  if(n.includes('COIL')) return 'COIL';
  return 'PLATE';}
function statusOf(r){const w=+r.InWhsQty||0,d=+r.DeliveredQty||0,p=+r.ProcessedQty||0;
  if(w>1e-6) return {s:'In Whs',q:w,c:'#0e7a4b'};
  if(d>=p&&d>1e-6) return {s:'Delivered',q:d,c:'#1367a6'};
  if(p>1e-6) return {s:'Processed',q:p,c:'#9a6a1c'};
  return {s:'In Whs',q:w,c:'#888'};}
const coilMill=r=>brandNorm(r.ItemName);
function coilFiltered(){
  // returns ordered [ {coil, mill, by:{CAT:[items]}, cW,cP,cD} ] after filters, + flat rows for export
  const onlyStock=$('coilOnlyStock')?$('coilOnlyStock').checked:true;
  const fStatus=$('coilStatus')?$('coilStatus').value:'';
  const fMill=$('coilMill')?$('coilMill').value:'';
  const qs=($('coilSearch')?$('coilSearch').value:'').trim().toUpperCase();
  const G={}; TRACE.forEach(r=>{const k=(r.CoilNo||'').trim()||'(no coil no)';(G[k]??=[]).push(r);});
  const inW=k=>G[k].reduce((a,r)=>a+(+r.InWhsQty||0),0);
  let keys=Object.keys(G);
  if(onlyStock) keys=keys.filter(k=>inW(k)>1e-6);
  if(qs) keys=keys.filter(k=>k.toUpperCase().includes(qs)||G[k].some(r=>(r.BatchNum||'').toUpperCase().includes(qs)));
  keys.sort((a,b)=>inW(b)-inW(a));
  const out=[], flat=[];
  keys.forEach(k=>{
    const rows=G[k]; if(fMill && coilMill(rows[0])!==fMill) return;
    const by={COIL:[],PLATE:[],PLATESCRAP:[],STRIP:[],STRIPSCRAP:[]};
    let any=false;
    rows.forEach(r=>{ const st=statusOf(r); if(fStatus && st.s!==fStatus) return;
      by[clsOf(r.ItemName)].push({...r,_st:st}); any=true;
      flat.push({Coil:k, Mill:coilMill(r), Category:CLSLABEL[clsOf(r.ItemName)], ItemCode:r.ItemCode, ItemName:(r.ItemName||'').trim(),
                 Batch:r.BatchNum, Status:st.s, Qty:+st.q.toFixed(3), InWhs:+(+r.InWhsQty||0).toFixed(3), Processed:+(+r.ProcessedQty||0).toFixed(3), Delivered:+(+r.DeliveredQty||0).toFixed(3)});
    });
    if(!any) return;
    Object.values(by).forEach(a=>a.sort((x,y)=>y._st.q-x._st.q));
    out.push({coil:k, mill:coilMill(rows[0]), by,
      cW:rows.reduce((a,r)=>a+(+r.InWhsQty||0),0), cP:rows.reduce((a,r)=>a+(+r.ProcessedQty||0),0), cD:rows.reduce((a,r)=>a+(+r.DeliveredQty||0),0)});
  });
  return {out, flat};
}
const CLSLABEL={COIL:'Coil',PLATE:'Plate',PLATESCRAP:'Plate-Scrap',STRIP:'Strip',STRIPSCRAP:'Strip-Scrap'};
let COIL_FLAT=[];
function renderByCoil(){
  const body=$('coilBody'); if(!body) return;
  if(!TRACE.length){ body.innerHTML='<div class="card"><div class="empty">Coil traceability isn\'t published yet. It appears automatically once the updated 15-minute job runs on the SAP box (it writes wheels_traceability.csv).</div></div>'; return; }
  // populate the mill dropdown once
  const msel=$('coilMill');
  if(msel && msel.options.length<=1){ const mills=[...new Set(TRACE.map(coilMill))].filter(m=>m&&m!=='Others').sort(); if([...new Set(TRACE.map(coilMill))].includes('Others'))mills.push('Others'); msel.insertAdjacentHTML('beforeend', mills.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')); }
  const {out, flat}=coilFiltered(); COIL_FLAT=flat;
  const stBadge=st=>`<span style="color:${st.c};font-weight:600">${st.s}</span>`;
  const nm=s=>esc((s||'').replace(/\s+WIR\d+\s*$/i,'').trim());
  const h2=lbls=>lbls.map(l=>`<th class="l" style="font-size:9px">${l}</th>`).join('');
  let tW=0,tP=0,tD=0, html=`<div style="overflow-x:auto"><table class="x" style="font-size:10px;white-space:nowrap">
    <thead>
    <tr><th class="l" rowspan="2" style="background:#0e2a47;color:#fff;vertical-align:middle">Source Coil</th>${CLS.map(c=>`<th class="l" colspan="${c[0]==='COIL'?6:5}" style="background:${c[2]};color:#fff;font-size:11px;text-align:center">${c[1]}</th>`).join('')}</tr>
    <tr>${h2(['Item Code','Item Name','Batch No','Coil No','Status','Qty'])}${h2(['Item Code','Item Name','Batch No','Status','Qty'])}${h2(['Item Code','Item Name','Batch No','Status','Qty'])}${h2(['Item Code','Item Name','Batch No','Status','Qty'])}${h2(['Item Code','Item Name','Batch No','Status','Qty'])}</tr>
    </thead><tbody>`;
  out.forEach(g=>{
    tW+=g.cW;tP+=g.cP;tD+=g.cD;
    const by=g.by, maxN=Math.max(1,by.COIL.length,by.PLATE.length,by.PLATESCRAP.length,by.STRIP.length,by.STRIPSCRAP.length);
    for(let i=0;i<maxN;i++){
      html+='<tr>';
      if(i===0) html+=`<td class="srcc" rowspan="${maxN}">${esc(g.coil)}<div style="font-weight:400;font-size:9px;color:#778;margin-top:2px">IW ${g.cW.toFixed(2)} · Pr ${g.cP.toFixed(2)} · Dl ${g.cD.toFixed(2)}</div></td>`;
      const c=by.COIL[i];
      html+= c?`<td class="mono">${esc(c.ItemCode)}</td><td>${nm(c.ItemName)}</td><td class="mono">${esc(c.BatchNum)}</td><td class="mono" style="color:#777">${esc(c.CoilNo)}</td><td>${stBadge(c._st)}</td><td class="r" style="font-weight:600">${c._st.q.toFixed(3)}</td>`
             :'<td></td><td></td><td></td><td></td><td></td><td></td>';
      ['PLATE','PLATESCRAP','STRIP','STRIPSCRAP'].forEach(cat=>{const x=by[cat][i];
        html+= x?`<td class="mono">${esc(x.ItemCode)}</td><td>${nm(x.ItemName)}</td><td class="mono">${esc(x.BatchNum)}</td><td>${stBadge(x._st)}</td><td class="r" style="font-weight:600">${x._st.q.toFixed(3)}</td>`
               :'<td></td><td></td><td></td><td></td><td></td>';});
      html+='</tr>';
    }
  });
  html+='</tbody></table></div>';
  const head=`<div class="card"><h3>Coil traceability <span class="r">${out.length} source coil${out.length!==1?'s':''}</span></h3>
    <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:13px;margin-top:6px">
      <div>In warehouse: <b style="color:#0e7a4b">${tW.toFixed(3)} MT</b></div>
      <div>Processed (cut): <b style="color:#9a6a1c">${tP.toFixed(3)} MT</b></div>
      <div>Delivered to Wheels India: <b style="color:#1367a6">${tD.toFixed(3)} MT</b></div></div>
    <div class="snote" style="margin:10px 0 0">Grouped by SAP source coil number (U_CoilNo). Status is each piece's current state: <b>In Whs</b> held now, <b>Processed</b> cut into the next stage, or <b>Delivered</b> dispatched to Wheels India. Scrap off blanks/flats is Strip-Scrap; plate/defective scrap is Plate-Scrap.</div></div>`;
  body.innerHTML = out.length ? (head+html) : '<div class="card"><div class="empty">No source coils match the filter.</div></div>';
}
function exportCoilExcel(){
  if(!COIL_FLAT.length){ alert('Nothing to export for the current filter.'); return; }
  const cols=['Coil','Mill','Category','ItemCode','ItemName','Batch','Status','Qty','InWhs','Processed','Delivered'];
  const hdr={Coil:'Source Coil',Mill:'Mill',Category:'Category',ItemCode:'Item Code',ItemName:'Item Name',Batch:'Batch No',Status:'Status',Qty:'Qty (MT)',InWhs:'In Whs (MT)',Processed:'Processed (MT)',Delivered:'Delivered (MT)'};
  const stamp=new Date().toISOString().slice(0,10);
  if(window.XLSX){
    const data=[cols.map(c=>hdr[c]), ...COIL_FLAT.map(r=>cols.map(c=>r[c]))];
    const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:20},{wch:9},{wch:12},{wch:16},{wch:40},{wch:24},{wch:10},{wch:10},{wch:11},{wch:12},{wch:11}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Coil Traceability');
    XLSX.writeFile(wb, 'wheels_coil_traceability_'+stamp+'.xlsx'); return;
  }
  // fallback: CSV (opens in Excel)
  const q=v=>{v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv='﻿'+[cols.map(c=>hdr[c]).join(','), ...COIL_FLAT.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='wheels_coil_traceability_'+stamp+'.csv'; a.click();
}
