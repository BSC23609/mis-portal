<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ashok Leyland — Bharat Steel MIS</title>
<link rel="icon" type="image/png" href="../stock/BSC.png"/>
<script>window.PORTAL={module:'al'}</script>
<style>
  .altbl{table-layout:fixed}
  .altbl col.c-item{width:28%}
  .altbl col.c-whs{width:6%}
  .altbl col.c-grd{width:15%}
  .altbl col.c-thk{width:8%}
  .altbl col.c-wid{width:9%}
  .altbl col.c-mt{width:13%}
  .altbl col.c-coil{width:9%}
  .altbl col.c-old{width:12%}
  .altbl th.whs,.altbl td.whs{text-align:left;font-family:var(--mono)}
  .altbl td:first-child,.altbl td .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 2px 8px}
  .sechead h2{font-size:15px;font-weight:800;color:var(--ink);margin:0;letter-spacing:.01em}
  .sechead .sub{font-size:12px;color:var(--gray);font-family:var(--mono)}
  .src{color:var(--ink)}
</style>
</head><body>
<div class="pw">
  <div id="errbox"></div>
  <div class="kpis" id="kpis"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search item, coil no, grade…" oninput="draw()"/>
    <select id="whs" onchange="draw()"><option value="">All warehouses</option></select>
    <select id="thk" onchange="draw()"><option value="">All thickness</option></select>
    <select id="wid" onchange="draw()"><option value="">All width</option></select>
    <select id="grd" onchange="draw()"><option value="">All grade</option></select>
    <select id="sort" onchange="draw()">
      <option value="mt">Sort: On-hand ↓</option>
      <option value="age">Sort: Oldest coil ↓</option>
      <option value="name">Sort: Item A–Z</option>
    </select>
    <span class="fcount" id="fcount"></span>
  </div>
  <div id="sections"></div>
  <footer id="foot"></footer>
</div>
<script src="../_portal.js"></script>
<script>
let STOCK=[], COILS={};
const EXPANDED=new Set();
const fMT=n=>f3(n||0);
const key=r=>r.ItemCode+'|'+r.WhsCode;
const isCoil=n=>/COIL/i.test(n||'');
function fdate(s){if(!s)return '';const m=String(s).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return esc(String(s));const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${m[3]}-${M[+m[2]-1]}-${m[1].slice(2)}`;}

async function load(){
  let st='', co='';
  try{
    const [a,b]=await Promise.all([
      fetch(DATA_BASE+'/al_stock.csv?t='+Date.now()),
      fetch(DATA_BASE+'/al_coils.csv?t='+Date.now())
    ]);
    if(!a.ok) throw 0;
    st=await a.text(); co=b.ok?await b.text():'';
  }catch(e){ $('errbox').innerHTML='<div class="err">No <b>al_stock.csv</b> published yet. Run <code>refresh_al.ps1</code> on the SAP box to generate it, then reload.</div>'; setStamp(); return; }
  STOCK=parseCSV(st).map(r=>({...r, OnHand:num(r.OnHand), Committed:num(r.Committed), T:num(r.Thickness), W:num(r.Width)}));
  COILS={};
  parseCSV(co).forEach(r=>{ const c={...r, Quantity:num(r.Quantity)}; (COILS[r.ItemCode+'|'+r.WhsCode]??=[]).push(c); });
  const whs =[...new Set(STOCK.map(r=>r.WhsCode).filter(Boolean))].sort();
  const thks=[...new Set(STOCK.map(r=>r.T).filter(v=>v||v===0))].sort((a,b)=>a-b);
  const wids=[...new Set(STOCK.map(r=>r.W).filter(v=>v||v===0))].sort((a,b)=>a-b);
  const grds=[...new Set(STOCK.map(r=>r.Grade).filter(Boolean))].sort();
  const whName={}; STOCK.forEach(r=>{ if(r.WhsCode) whName[r.WhsCode]=r.WhsName||r.WhsCode; });
  $('whs').innerHTML='<option value="">All warehouses</option>'+whs.map(w=>`<option value="${esc(w)}">${esc(w)}${whName[w]&&whName[w]!==w?' · '+esc(whName[w]):''}</option>`).join('');
  $('thk').innerHTML='<option value="">All thickness</option>'+thks.map(t=>`<option>${t}</option>`).join('');
  $('wid').innerHTML='<option value="">All width</option>'+wids.map(w=>`<option>${w}</option>`).join('');
  $('grd').innerHTML='<option value="">All grade</option>'+grds.map(g=>`<option>${esc(g)}</option>`).join('');
  setStamp();
  draw();
}

function oldestOf(k){
  const cs=COILS[k]||[]; let o=null;
  cs.forEach(c=>{ if(c.GRPODate && (!o || c.GRPODate<o)) o=c.GRPODate; });
  return o;
}
function filtered(){
  const q=$('q').value.trim().toLowerCase(), wh=$('whs').value, t=$('thk').value, w=$('wid').value, g=$('grd').value;
  return STOCK.filter(r=>{
    if(wh && r.WhsCode!==wh) return false;
    if(t && String(r.T)!==t) return false;
    if(w && String(r.W)!==w) return false;
    if(g && r.Grade!==g) return false;
    if(q){ const coilHit=(COILS[key(r)]||[]).some(c=>(c.CoilNo||'').toLowerCase().includes(q));
      if(![r.ItemName,r.ItemCode,r.Grade].some(v=>(v||'').toLowerCase().includes(q)) && !coilHit) return false; }
    return true;
  });
}
function sortRows(rows){
  const sort=$('sort').value;
  return rows.sort((a,b)=> sort==='name'?a.ItemName.localeCompare(b.ItemName)
    : sort==='age'? String(oldestOf(key(a))||'9').localeCompare(String(oldestOf(key(b))||'9'))
    : b.OnHand-a.OnHand);
}

// cut: false => coils section (drill = coil no); true => sheets & plates (drill = source coil)
function sectionHtml(rows, cut){
  rows=sortRows(rows.slice());
  const unit = cut ? 'Pieces' : 'Coils';
  let h=`<div class="card"><div class="tblwrap scroll"><table class="altbl"><colgroup><col class="c-item"><col class="c-whs"><col class="c-grd"><col class="c-thk"><col class="c-wid"><col class="c-mt"><col class="c-coil"><col class="c-old"></colgroup><thead><tr><th>Item</th><th class="whs">Whs</th><th>Grade</th><th class="num">Thick</th><th class="num">Width</th><th class="num">On-hand (MT)</th><th class="num">${unit}</th><th class="num">Oldest in</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const cs=(COILS[key(r)]||[]).slice().sort((a,b)=>String(a.GRPODate||'').localeCompare(String(b.GRPODate||'')));
    const open=EXPANDED.has(key(r));
    h+=`<tr class="grp" onclick="toggle('${key(r).replace(/'/g,"\\'")}')"><td><span class="tw">${cs.length?(open?'▾':'▸'):'&nbsp;'}</span>${esc(r.ItemName)}<div class="muted">${esc(r.ItemCode)}</div></td><td class="whs">${esc(r.WhsCode)}</td><td class="muted">${esc(r.Grade)}</td><td class="num">${r.T||''}</td><td class="num">${r.W||''}</td><td class="num"><b>${fMT(r.OnHand)}</b></td><td class="num">${cs.length||''}</td><td class="num">${fdate(oldestOf(key(r)))}</td></tr>`;
    if(open && cs.length){
      cs.forEach(c=>{
        if(cut){
          h+=`<tr class="itm"><td>Source coil <b class="src">${esc(c.CoilNo||'—')}</b>${c.BatchNum?`<div class="muted">cut batch ${esc(c.BatchNum)}</div>`:''}</td><td class="whs muted">${esc(c.WhsCode)}</td><td class="muted" colspan="2">GRPO ${esc(c.GRPONo||'')}</td><td></td><td class="num">${fMT(c.Quantity)}</td><td></td><td class="num">${fdate(c.GRPODate)}</td></tr>`;
        } else {
          h+=`<tr class="itm"><td>Coil <b>${esc(c.CoilNo||'—')}</b>${c.BatchNum?`<div class="muted">batch ${esc(c.BatchNum)}</div>`:''}</td><td class="whs muted">${esc(c.WhsCode)}</td><td class="muted" colspan="2">GRPO ${esc(c.GRPONo||'')}</td><td></td><td class="num">${fMT(c.Quantity)}</td><td></td><td class="num">${fdate(c.GRPODate)}</td></tr>`;
        }
      });
    }
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

function draw(){
  const rows=filtered();
  const coilRows=rows.filter(r=>isCoil(r.ItemName));
  const cutRows =rows.filter(r=>!isCoil(r.ItemName));
  const sum=rs=>rs.reduce((a,r)=>a+r.OnHand,0);
  const cnt=rs=>rs.reduce((a,r)=>a+((COILS[key(r)]||[]).length),0);
  let oldest=null; rows.forEach(r=>{const o=oldestOf(key(r)); if(o&&(!oldest||o<oldest))oldest=o;});

  $('kpis').innerHTML=`
    <div class="kpi"><div class="lab">Coil stock (MT)</div><div class="val">${fMT(sum(coilRows))}</div></div>
    <div class="kpi"><div class="lab">Sheet + plate stock (MT)</div><div class="val">${fMT(sum(cutRows))}</div></div>
    <div class="kpi"><div class="lab">Total on-hand (MT)</div><div class="val">${fMT(sum(rows))}</div></div>
    <div class="kpi"><div class="lab">Oldest in</div><div class="val">${oldest?fdate(oldest):'—'}</div></div>`;

  let html='';
  html+=`<div class="sechead"><h2>Coils</h2><span class="sub">${coilRows.length} items · ${fMT(sum(coilRows))} MT · ${cnt(coilRows)} coils</span></div>`;
  html+= coilRows.length ? sectionHtml(coilRows,false) : '<div class="card"><div class="empty">No coil stock for this filter.</div></div>';
  html+=`<div class="sechead"><h2>Sheets &amp; Plates <span class="sub" style="font-weight:600">— showing source coil</span></h2><span class="sub">${cutRows.length} items · ${fMT(sum(cutRows))} MT · ${cnt(cutRows)} pieces</span></div>`;
  html+= cutRows.length ? sectionHtml(cutRows,true) : '<div class="card"><div class="empty">No sheet / plate stock for this filter.</div></div>';
  $('sections').innerHTML=html;

  $('fcount').textContent=`${rows.length} rows · ${fMT(sum(rows))} MT`;
  $('foot').textContent='Ashok Leyland stock — the AL item list across all warehouses. Coils show the mill coil number; sheets & plates show the source coil they were cut from (SAP batch records).';
}
function toggle(k){ if(EXPANDED.has(k))EXPANDED.delete(k); else EXPANDED.add(k); draw(); }
load();
</script>
</body></html>
