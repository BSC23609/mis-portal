<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ashok Leyland — Bharat Steel MIS</title>
<link rel="icon" type="image/png" href="../stock/BSC.png"/>
<script>window.PORTAL={module:'al'}</script>
</head><body>
<div class="pw">
  <div id="errbox"></div>
  <div class="kpis" id="kpis"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search item, coil no, grade…" oninput="draw()"/>
    <select id="thk" onchange="draw()"><option value="">All thickness</option></select>
    <select id="wid" onchange="draw()"><option value="">All width</option></select>
    <select id="grd" onchange="draw()"><option value="">All grade</option></select>
    <select id="sort" onchange="draw()">
      <option value="mt">Sort: On-hand ↓</option>
      <option value="age">Sort: Oldest coil ↓</option>
      <option value="name">Sort: Item A–Z</option>
    </select>
    <span class="fcount" id="fcount"></span>
  </div>
  <div class="card"><div class="tblwrap scroll" id="tbl"></div></div>
  <footer id="foot"></footer>
</div>
<script src="../_portal.js"></script>
<script>
let STOCK=[], COILS={};
const EXPANDED=new Set();
const fMT=n=>f3(n||0);
function fdate(s){if(!s)return '';const m=String(s).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return esc(String(s));const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${m[3]}-${M[+m[2]-1]}-${m[1].slice(2)}`;}
const sz = (t,w) => (t||'?')+' × '+(w||'?');

async function load(){
  let st='', co='';
  try{
    const [a,b]=await Promise.all([
      fetch(DATA_BASE+'/al_stock.csv?t='+Date.now()),
      fetch(DATA_BASE+'/al_coils.csv?t='+Date.now())
    ]);
    if(!a.ok) throw 0;
    st=await a.text(); co=b.ok?await b.text():'';
  }catch(e){ $('errbox').innerHTML='<div class="err">No <b>al_stock.csv</b> published yet. Run <code>refresh_al.ps1</code> on the SAP box to generate it, then reload.</div>'; setStamp(); return; }
  STOCK=parseCSV(st).map(r=>({...r, OnHand:num(r.OnHand), Committed:num(r.Committed), T:num(r.Thickness), W:num(r.Width)}));
  COILS={};
  parseCSV(co).forEach(r=>{ const c={...r, Quantity:num(r.Quantity)}; (COILS[r.ItemCode]??=[]).push(c); });
  const thks=[...new Set(STOCK.map(r=>r.T).filter(v=>v||v===0))].sort((a,b)=>a-b);
  const wids=[...new Set(STOCK.map(r=>r.W).filter(v=>v||v===0))].sort((a,b)=>a-b);
  const grds=[...new Set(STOCK.map(r=>r.Grade).filter(Boolean))].sort();
  $('thk').innerHTML='<option value="">All thickness</option>'+thks.map(t=>`<option>${t}</option>`).join('');
  $('wid').innerHTML='<option value="">All width</option>'+wids.map(w=>`<option>${w}</option>`).join('');
  $('grd').innerHTML='<option value="">All grade</option>'+grds.map(g=>`<option>${esc(g)}</option>`).join('');
  setStamp();
  draw();
}

function oldestOf(code){
  const cs=COILS[code]||[]; let o=null;
  cs.forEach(c=>{ if(c.GRPODate && (!o || c.GRPODate<o)) o=c.GRPODate; });
  return o;
}
function filtered(){
  const q=$('q').value.trim().toLowerCase(), t=$('thk').value, w=$('wid').value, g=$('grd').value;
  return STOCK.filter(r=>{
    if(t && String(r.T)!==t) return false;
    if(w && String(r.W)!==w) return false;
    if(g && r.Grade!==g) return false;
    if(q){ const coilHit=(COILS[r.ItemCode]||[]).some(c=>(c.CoilNo||'').toLowerCase().includes(q));
      if(![r.ItemName,r.ItemCode,r.Grade].some(v=>(v||'').toLowerCase().includes(q)) && !coilHit) return false; }
    return true;
  });
}

function draw(){
  let rows=filtered();
  const sort=$('sort').value;
  rows.sort((a,b)=> sort==='name'?a.ItemName.localeCompare(b.ItemName)
    : sort==='age'? String(oldestOf(a.ItemCode)||'9').localeCompare(String(oldestOf(b.ItemCode)||'9'))
    : b.OnHand-a.OnHand);
  const totMT=rows.reduce((a,r)=>a+r.OnHand,0);
  const totCoils=rows.reduce((a,r)=>a+((COILS[r.ItemCode]||[]).length),0);
  let oldest=null; rows.forEach(r=>{const o=oldestOf(r.ItemCode); if(o&&(!oldest||o<oldest))oldest=o;});
  $('kpis').innerHTML=`
    <div class="kpi"><div class="lab">Items in stock</div><div class="val">${rows.length}</div></div>
    <div class="kpi"><div class="lab">On-hand (MT)</div><div class="val">${fMT(totMT)}</div></div>
    <div class="kpi"><div class="lab">Coils</div><div class="val">${totCoils}</div></div>
    <div class="kpi"><div class="lab">Oldest coil</div><div class="val">${oldest?fdate(oldest):'—'}</div></div>`;

  let h=`<table><thead><tr><th>Item</th><th>Grade</th><th class="num">Thick</th><th class="num">Width</th><th class="num">On-hand (MT)</th><th class="num">Coils</th><th class="num">Oldest in</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const cs=(COILS[r.ItemCode]||[]).slice().sort((a,b)=>String(a.GRPODate||'').localeCompare(String(b.GRPODate||'')));
    const open=EXPANDED.has(r.ItemCode);
    h+=`<tr class="grp" onclick="toggle('${r.ItemCode.replace(/'/g,"\\'")}')"><td><span class="tw">${cs.length?(open?'▾':'▸'):'&nbsp;'}</span>${esc(r.ItemName)}<div class="muted">${esc(r.ItemCode)}</div></td><td class="muted">${esc(r.Grade)}</td><td class="num">${r.T||''}</td><td class="num">${r.W||''}</td><td class="num"><b>${fMT(r.OnHand)}</b></td><td class="num">${cs.length||''}</td><td class="num">${fdate(oldestOf(r.ItemCode))}</td></tr>`;
    if(open && cs.length){
      cs.forEach(c=>{
        h+=`<tr class="itm"><td>Coil <b>${esc(c.CoilNo||'—')}</b>${c.BatchNum?`<div class="muted">batch ${esc(c.BatchNum)}</div>`:''}</td><td class="muted" colspan="3">GRPO ${esc(c.GRPONo||'')}</td><td class="num">${fMT(c.Quantity)}</td><td></td><td class="num">${fdate(c.GRPODate)}</td></tr>`;
      });
    }
  });
  h+=`</tbody></table>`;
  $('tbl').innerHTML=rows.length?h:'<div class="empty">No Ashok Leyland stock in WH 53 for this filter.</div>';
  $('fcount').textContent=`${rows.length} items · ${fMT(totMT)} MT · ${totCoils} coils`;
  $('foot').textContent='Ashok Leyland job-work stock — AL item list held in WH 53 (AL-Job work). Coil number + received (GRPO) date from the batch records.';
}
function toggle(k){ if(EXPANDED.has(k))EXPANDED.delete(k); else EXPANDED.add(k); draw(); }
load();
</script>
</body></html>
